services:
  - type: web
    name: deriv-insight-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DERIV_DEMO_ENABLED
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: deriv-insight-db
          property: connectionString

databases:
  - name: deriv-insight-db
    plan: 0.1c-256mb
    connectionPool: none
